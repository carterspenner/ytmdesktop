---
name: Application Build

on:
  - push
  - pull_request

# actions/upload-artifact counts against the repo's (limited) Actions storage quota and
# accumulates run after run. Build output is instead uploaded as assets on a single rolling
# "ci-latest" pre-release, which doesn't count against that quota and never grows - each run's
# assets just replace the previous ones.
permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the ci-latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh release create needs a repo to target and won't infer one without a checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view ci-latest >/dev/null 2>&1 && exit 0
          # Two runs racing to create this for the first time both land here; whichever loses
          # the race gets a "release already exists" error from gh, which is fine.
          gh release create ci-latest \
            --title "Latest CI build" \
            --notes "Automatically replaced by the most recent CI run on any branch/PR - this is build output for testing, not an official release. See the Releases page for versioned releases." \
            --prerelease || gh release view ci-latest >/dev/null 2>&1

  build:
    needs: ensure-release
    strategy:
      matrix:
        os: [
            { name: 'linux',   image: 'ubuntu-latest' },
            { name: 'windows', image: 'windows-latest' },
            { name: 'macos',   image: 'macos-latest' }
          ]
        arch: [ 'x64', 'arm64' ]
      fail-fast: false
          

    runs-on: ${{ matrix.os.image }}

    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - name: Corepack Enable Yarn
        run: corepack enable yarn

      - name: Setup Node (v20)
        uses: actions/setup-node@v4
        with:
          # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-data
          cache: 'yarn'
          node-version: "20.9.0"

      - name: Install dependencies
        run: yarn --immutable

      - name: Build (${{ matrix.arch }})
        # if: matrix.os.image == 'macos-latest'
        env:
          YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER }}
          YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY }}
        run: yarn make --arch ${{ matrix.arch }}

      - name: Upload build to the ci-latest release (${{ matrix.arch }})
        # A fork PR's GITHUB_TOKEN is read-only against this repo regardless of the
        # `permissions:` above - that's a hard GitHub restriction, not something this workflow
        # can grant its way around. Skipping the upload there still lets the build/test steps
        # above report real pass/fail status for the PR; only the release asset is skipped.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Maker output filenames don't already encode the OS/arch, so two matrix jobs can
          # produce the exact same filename - stage renamed copies to guarantee every asset
          # uploaded to the shared ci-latest release is unique instead of one clobbering another.
          # Spaces are also stripped: GitHub normalizes spaces in stored asset names, which makes
          # `gh release upload --clobber`'s own "does this already exist" check miss the match
          # against a previous run's asset and fall through to a raw 422 from the upload endpoint
          # instead of replacing it (https://github.com/cli/cli/issues/7024).
          mkdir -p release-assets
          shopt -s nullglob
          for f in out/make/squirrel.windows/${{ matrix.arch }}/*.exe \
                   out/make/deb/${{ matrix.arch }}/*.deb \
                   out/make/rpm/${{ matrix.arch }}/*.rpm \
                   out/make/zip/darwin/${{ matrix.arch }}/*.zip; do
            clean_name=$(basename "$f" | tr ' ' '-')
            cp "$f" "release-assets/ytmd-${{ matrix.os.name }}-${{ matrix.arch }}-$clean_name"
          done

          if [ -z "$(ls -A release-assets)" ]; then
            echo "No build output matched for ${{ matrix.os.name }}/${{ matrix.arch }} - nothing to upload"
            exit 0
          fi

          # Explicit delete-then-upload rather than relying on --clobber's own matching, which
          # is unreliable even without the space issue above (see cli/cli#7178, cli/cli#4863).
          for f in release-assets/*; do
            name=$(basename "$f")
            gh release delete-asset ci-latest "$name" -y 2>/dev/null || true
            gh release upload ci-latest "$f"
          done

  build-arch:
    # There is no maintained Electron Forge maker for pacman packages, so this job packages
    # the app with `electron-forge package` (skipping the deb/rpm/squirrel/zip makers) and
    # builds a .pkg.tar.zst itself with makepkg inside an Arch Linux container, using
    # packaging/arch/PKGBUILD.
    needs: ensure-release
    strategy:
      matrix:
        arch: [
            { node: 'x64',   pacman: 'x86_64' },
            { node: 'arm64', pacman: 'aarch64' }
          ]
      fail-fast: false

    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      # Arch's own nodejs package tracks current (Node 26 at the time of writing), which the
      # Vite plugin's packaging process-exit handling doesn't seem to like - it was exiting
      # 0 mid-way through extracting the Electron zip, before out/ ever got written. Pinning
      # the same Node version the other build jobs use avoids that entirely. github-cli is for
      # uploading the packaged build to the ci-latest release below - the base container doesn't
      # include it.
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git github-cli

      - name: Github checkout
        uses: actions/checkout@v4

      # The checkout is owned by a different UID than the container runs as, which git's
      # safe.directory check (CVE-2022-24765 mitigation) rejects; viteconfig/main.ts shells
      # out to `git rev-parse` during the build, so this must be set before packaging.
      - name: Mark repository as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node (v20)
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"

      - name: Install dependencies
        run: node .yarn/releases/yarn-*.cjs install --immutable

      - name: Package (${{ matrix.arch.node }})
        env:
          YTMD_UPDATE_FEED_OWNER: ${{ vars.YTMD_UPDATE_FEED_OWNER }}
          YTMD_UPDATE_FEED_REPOSITORY: ${{ vars.YTMD_UPDATE_FEED_REPOSITORY }}
          DEBUG: "electron-packager,electron-forge:*"
        run: node .yarn/releases/yarn-*.cjs package --arch ${{ matrix.arch.node }} --platform linux

      - name: Stage packaged app for makepkg
        run: |
          echo "--- pwd ---"
          pwd
          echo "--- workspace contents (2 levels) ---"
          find . -maxdepth 2 -not -path "./node_modules*" -not -path "./.git*"
          echo "--- searching for packaged app directory ---"
          find "$(pwd)" -maxdepth 3 -not -path "*/node_modules/*" -iname "*-linux-*" -type d 2>/dev/null || true
          PACKAGE_DIR=$(find "$(pwd)" -maxdepth 3 -not -path "*/node_modules/*" -iname "*-linux-*" -type d 2>/dev/null | head -n 1)
          echo "Using package dir: $PACKAGE_DIR"
          mkdir -p out
          mv "$PACKAGE_DIR" out/app
          tar -C out -czf packaging/arch/app.tar.gz app
          cp src/assets/icons/ytmd.png packaging/arch/youtube-music-desktop-app.png

      - name: Build Arch package
        working-directory: packaging/arch
        run: |
          useradd -m builder
          chown -R builder:builder .
          YTMD_PKGVER=$(node -p "require('../../package.json').version")
          # --nodeps: this only assembles the archive from already-built binaries, it doesn't
          # compile anything, so the runtime libraries in depends=() don't need to be installed
          # on the machine doing the packaging.
          # --ignorearch: the aarch64 job still runs on an x86_64 GitHub-hosted runner (there's
          # no arm64 runner here) - it's cross-packaging prebuilt binaries, not compiling, so
          # makepkg's own-machine-architecture check is a false positive here.
          su builder -c "YTMD_PKGVER=$YTMD_PKGVER YTMD_PKGARCH=${{ matrix.arch.pacman }} makepkg -f --noconfirm --nodeps --ignorearch"

      - name: Upload build to the ci-latest release (${{ matrix.arch.node }})
        # See the equivalent step in the build job above - fork PRs can't get a writable token
        # here no matter what this workflow requests, so the upload is skipped rather than
        # failing the job over something outside this workflow's control.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # See the equivalent step in the build job above for why filenames are staged with
          # spaces stripped and why this deletes-then-uploads rather than using --clobber.
          mkdir -p release-assets
          shopt -s nullglob
          for f in packaging/arch/*.pkg.tar.zst; do
            clean_name=$(basename "$f" | tr ' ' '-')
            cp "$f" "release-assets/ytmd-archlinux-${{ matrix.arch.node }}-$clean_name"
          done

          if [ -z "$(ls -A release-assets)" ]; then
            echo "No build output matched for archlinux/${{ matrix.arch.node }} - nothing to upload"
            exit 0
          fi

          for f in release-assets/*; do
            name=$(basename "$f")
            gh release delete-asset ci-latest "$name" -y 2>/dev/null || true
            gh release upload ci-latest "$f"
          done
